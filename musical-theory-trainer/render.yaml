# Render Blueprint: "New > Blueprint", choose this repository (render.yaml must be at the root).
# Creates the web service and a PostgreSQL database and connects them.
services:
  - type: web
    name: musical-theory-trainer
    rootDir: musical-theory-trainer
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false
